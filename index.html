<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Mensaje - Soporte</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Enviar Reporte</h1>
            <a href="receptor.html" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-3 py-1.5 rounded-lg transition">Ver Tablero ➔</a>
        </div>

        <form id="mensajeForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tu Nombre / Área</label>
                <input type="text" id="autor" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: Juan Pérez / Caja">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tipo de Mensaje</label>
                <select id="tipo" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <option value="Problema de sistema/plataforma">Problema de sistema/plataforma</option>
                    <option value="Mejora">Mejora</option>
                    <option value="Implementacion de plataforma nueva">Implementación de plataforma nueva</option>
                    <option value="Duda">Duda</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Descripción del Mensaje</label>
                <textarea id="descripcion" rows="4" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Describe detalladamente la situación..."></textarea>
            </div>

            <button type="submit" id="btnEnviar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-500/30">
                Enviar Mensaje
            </button>
        </form>

        <div id="mensajeAlerta" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded-xl text-center text-sm font-medium">
            ¡Mensaje enviado correctamente!
        </div>
    </div>

    <!-- Firebase conectado con tus credenciales reales -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRmtC1M60U-YlxoIix5D6roKXs_houaFY",
            authDomain: "sis-mensajeria.firebaseapp.com",
            databaseURL: "https://sis-mensajeria-default-rtdb.firebaseio.com",
            projectId: "sis-mensajeria",
            storageBucket: "sis-mensajeria.firebasestorage.app",
            messagingSenderId: "616024640068",
            appId: "1:616024640068:web:1b0b95c61c83135760ca11",
            measurementId: "G-ED1G77DTQ6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('mensajeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.innerText = "Enviando...";

            try {
                await addDoc(collection(db, "mensajes"), {
                    autor: document.getElementById('autor').value,
                    tipo: document.getElementById('tipo').value,
                    descripcion: document.getElementById('descripcion').value,
                    fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now()
                });

                document.getElementById('mensajeAlerta').classList.remove('hidden');
                document.getElementById('mensajeForm').reset();
                setTimeout(() => {
                    document.getElementById('mensajeAlerta').classList.add('hidden');
                }, 3000);
            } catch (error) {
                alert("Hubo un error al enviar el mensaje.");
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "Enviar Mensaje";
            }
        });
    </script>
</body>
</html>
